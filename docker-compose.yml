  services:

    postgres:
      image: postgres:16-alpine
      container_name: postgres
      restart: always
      ports:
        - "5433:5432"
      environment:
        POSTGRES_USER: vod
        POSTGRES_PASSWORD: vod
        POSTGRES_DB: vod
      volumes:
        - pgdata:/var/lib/postgresql/data
      healthcheck:
        # the $$ is a docker-compose file requirement
        test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 5s
        retries: 10
        start_period: 5s


    migrate:
      image: migrate/migrate:v4.18.3

      depends_on:
        postgres:
          condition: service_healthy

      profiles:
        - migrate


      volumes:
        - ./migrations:/migrations

    minio:
      image: quay.io/minio/minio
      container_name: minio
      restart: always
      ports:
        - "9000:9000"
        - "9001:9001"
      environment:
        MINIO_ROOT_USER: adminpass
        MINIO_ROOT_PASSWORD: adminpass
      command: server --console-address ":9001" /data
      volumes:
        - ~/minio-data:/data
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
        interval: 5s
        retries: 10


    redis:
      image: redis:alpine
      container_name: redis
      restart: always
      ports:
        - "6379:6379"
      healthcheck:
        test: ['CMD',"redis-cli","ping"]
        interval: 5s
        timeout: 5s
        retries: 10


    # http api server
    backend-api:
      build:
        context: .
        dockerfile: Dockerfile
      command: ["./api"]
      environment:
        - REDIS_ADDR=redis:6379
        - MINIO_ENDPOINT=minio:9000
        - DATABASE_URL=postgres://vod:vod@postgres:5432/vod?sslmode=disable
      container_name: backend-api
      depends_on:
          postgres:
            condition: service_healthy
          minio:
            condition: service_started
          redis:
            condition: service_started

    backend-worker:
      build:
        context: .
        dockerfile: Dockerfile
      command: ["./worker"]
      environment:
        - REDIS_ADDR=redis:6379
        - MINIO_ENDPOINT=minio:9000
      depends_on:
        postgres:
          condition: service_healthy
        minio:
          condition: service_started
        redis:
          condition: service_started
      container_name:
        backend-worker
      stop_grace_period: 10m

    nginx:
      image: nginx:latest
      ports:
        - "8080:80"
      volumes:
        - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      depends_on:
        - backend-api
        - minio
  volumes:
    pgdata:
