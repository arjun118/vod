services:
  minio:
    image: quay.io/minio/minio
    container_name: minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: adminpass
      MINIO_ROOT_PASSWORD: adminpass
    command: server --console-address ":9001" /data
    volumes:
      - ~/minio-data:/data
  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
  # http api server
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["./api"]
    environment:
      - REDIS_ADDR=redis:6379
      - MINIO_ENDPOINT=minio:9000
    container_name:
      backend-api
    depends_on:
        - minio
        - redis

  backend-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["./worker"]
    environment:
      - REDIS_ADDR=redis:6379
      - MINIO_ENDPOINT=minio:9000
    depends_on:
        - minio
        - redis
    container_name:
      backend-worker
    stop_grace_period: 10m

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend-api
      - minio
